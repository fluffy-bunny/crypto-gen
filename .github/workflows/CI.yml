name: Go

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "**.md"
    branches: [main]
env:
  BINARY: "cli"
  GO_VERSION: "1.25"
  BUILD_PATH: "./cmd/cli"
  DOCKER_IMAGE_NAME: "ghstahl/crypto-gen"

jobs:
  pre_flight:
    runs-on: ubuntu-latest

    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
      changelog: ${{ steps.tag_version.outputs.changelog }}
    steps:
      - name: Establish tags and versions
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: [pre_flight]
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Echo Tags
        run: |
          echo new_tag: ${{needs.pre_flight.outputs.new_tag}}
          echo changelog: ${{needs.pre_flight.outputs.changelog}}
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "^${{ env.GO_VERSION }}"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -mod=mod -v -a -tags netgo -ldflags "-X 'main.version=${{needs.pre_flight.outputs.new_tag}}' -extldflags '-static'" -o ${{ env.BINARY }} ${{ env.BUILD_PATH }}

      - uses: actions/upload-artifact@v4
        with:
          name: cli-linux-${{ matrix.goarch }}
          path: ./${{ env.BINARY }}

      # Tests only need to run once, and only on the native runner arch --
      # a cross-compiled linux/arm64 test binary can't execute on this amd64 runner.
      - name: Test
        if: matrix.goarch == 'amd64'
        run: go test -v ./...


  # Create and post docker image
  build-docker-push-image:
    runs-on: ubuntu-latest
    needs: [pre_flight, build]

    steps:
      - name: Echo Tags
        run: |
          echo new_tag: ${{needs.pre_flight.outputs.new_tag}} 
          echo changelog: ${{needs.pre_flight.outputs.changelog}}

      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-amd64
          path: build

      # If we ever have more than 1 file, tar before actions/upload-artifact
      - name: Fix Execute Bit
        run: chmod +x build/${{ env.BINARY }}

      - name: ls build dir
        run: |
          ls build/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
      - name: Inspect builder
        run: |
          echo "Name:      ${{ steps.buildx.outputs.name }}"
          echo "Endpoint:  ${{ steps.buildx.outputs.endpoint }}"
          echo "Status:    ${{ steps.buildx.outputs.status }}"
          echo "Flags:     ${{ steps.buildx.outputs.flags }}"
          echo "Platforms: ${{ steps.buildx.outputs.platforms }}"
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push docker_build
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./build
          file: ./docker/Dockerfile
          push: true
          tags: ${{env.DOCKER_IMAGE_NAME}}:${{needs.pre_flight.outputs.new_tag}},${{env.DOCKER_IMAGE_NAME}}:latest

      - name: Image digest docker_build
        run: echo ${{ steps.docker_build.outputs.digest }}

  # Publish standalone linux/amd64 + linux/arm64 binaries as GitHub Release
  # assets, for consumers (e.g. Pulumi automation) that shell out to the CLI
  # directly instead of running the docker image.
  release-binaries:
    runs-on: ubuntu-latest
    needs: [pre_flight, build]
    # Only cut a real release from main -- feature-branch/PR builds still get
    # exercised above, they just don't get published anywhere.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.pre_flight.outputs.new_tag != ''
    permissions:
      contents: write
    steps:
      - name: Download linux/amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-amd64
          path: dist/linux-amd64

      - name: Download linux/arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-arm64
          path: dist/linux-arm64

      - name: Package binaries
        run: |
          chmod +x dist/linux-amd64/${{ env.BINARY }} dist/linux-arm64/${{ env.BINARY }}
          tar -C dist/linux-amd64 -czf ${{ env.BINARY }}-linux-amd64.tar.gz ${{ env.BINARY }}
          tar -C dist/linux-arm64 -czf ${{ env.BINARY }}-linux-arm64.tar.gz ${{ env.BINARY }}
          sha256sum ${{ env.BINARY }}-linux-amd64.tar.gz ${{ env.BINARY }}-linux-arm64.tar.gz > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.pre_flight.outputs.new_tag }}
          name: ${{ needs.pre_flight.outputs.new_tag }}
          body: ${{ needs.pre_flight.outputs.changelog }}
          files: |
            ${{ env.BINARY }}-linux-amd64.tar.gz
            ${{ env.BINARY }}-linux-arm64.tar.gz
            checksums.txt
